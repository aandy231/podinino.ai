{{- if .Values.rbac.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "podinino.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: {{ include "podinino.name" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "podinino.fullname" . }}-manager
  labels:
    app.kubernetes.io/name: {{ include "podinino.name" . }}
rules:
  # Permissions to dynamically provision user workspace pods, PVCs, services & ingresses
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "persistentvolumeclaims", "secrets", "configmaps"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "podinino.fullname" . }}-manager-binding
  labels:
    app.kubernetes.io/name: {{ include "podinino.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "podinino.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "podinino.fullname" . }}-manager
  apiGroup: rbac.authorization.k8s.io
{{- end }}
