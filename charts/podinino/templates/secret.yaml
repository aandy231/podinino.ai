apiVersion: v1
kind: Secret
metadata:
  name: {{ include "podinino.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ include "podinino.name" . }}
type: Opaque
stringData:
  mongodb-url: {{ .Values.secret.mongodbUrl | quote }}
  encryption-key: {{ .Values.secret.encryptionKey | quote }}
  github-client-id: {{ .Values.secret.githubClientId | quote }}
  github-client-secret: {{ .Values.secret.githubClientSecret | quote }}
