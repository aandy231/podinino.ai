name: CI & Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install flake8 pytest
          pip install -r server/requirements.txt
      - name: Lint server
        run: |
          flake8 server/app --count --select=E9,F63,F7,F82 --show-source --statistics

  build-images:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Podinino Unified Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/server:latest
            ghcr.io/${{ github.repository_owner }}/server:${{ github.sha }}

      - name: Build & Push Claude Code Sandbox Image
        uses: docker/build-push-action@v5
        with:
          context: ./sandbox
          file: ./sandbox/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/claude-code-sandbox:latest
            ghcr.io/${{ github.repository_owner }}/claude-code-sandbox:${{ github.sha }}
