services:
  # Podinino Unified Server (UI + API + K8s provisioner)
  podinino:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: podinino-server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=podinino_db
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:8000/auth/callback}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-supersecretkey32byteslength1234!}
      - USE_IN_CLUSTER_CONFIG=false
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
    depends_on:
      - mongodb
    restart: unless-stopped

  # Single MongoDB database (Users, Workspaces, Chat history, Skills)
  mongodb:
    image: mongo:7.0
    container_name: podinino-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
