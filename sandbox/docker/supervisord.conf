[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=2
pidfile=/var/run/supervisord.pid

[program:fastapi]
command=/usr/local/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
user=developer
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",WORKSPACE_DIR="/workspace",PORT="8000",HOME="/home/developer",USER="developer"

[program:code-server]
command=code-server --bind-addr 0.0.0.0:8080 --auth none /workspace
directory=/workspace
user=developer
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="8080",HOME="/home/developer",USER="developer"
